name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
          pip install rdkit || echo "rdkit unavailable — molecular tests will skip/fail-soft"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test
        run: pytest -q --maxfail=5

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Import + certify smoke
        run: |
          python -c "import tantrium; ai = tantrium.AI(); c = ai.certify_all('EGFR'); print(c); assert c.sealed_hash"
          python -c "import tantrium; print(tantrium.AI().rh_certificate('aspirin').summary())"
      - name: CLI smoke (tantrium konsol komutu)
        run: |
          tantrium --version
          tantrium compare CCO CCCO --json
          tantrium discover-law 1 1 2 3 5 8 13 21
          tantrium status
      - name: Type-check (mypy, non-blocking — rdkit'siz ortam)
        continue-on-error: true
        run: mypy src || true
