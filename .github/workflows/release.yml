name: Release

# PyPI'ye GÜVENİLİR YAYIN (Trusted Publishing / OIDC — token YOK).
# Bir sürüm etiketi (vX.Y.Z) push edildiğinde tetiklenir.
#
# KURULUM (bir kez, repo sahibi): https://pypi.org/manage/account/publishing/
#   project: tantrium · owner: 4lptek1n · repo: Tantrium
#   workflow: release.yml · environment: pypi
#
# GÜVENLİK (Scientific-Python SPEC-8):
#   - id-token: write (OIDC) + ortam onayı (environment: pypi, manuel onay)
#   - imzalı build provenance attestation (PEP 740)
#   - varsayılan izinler kısıtlı (contents: read)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tantrium
    permissions:
      id-token: write        # OIDC — trusted publishing için ZORUNLU
      attestations: write    # imzalı provenance attestation
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
