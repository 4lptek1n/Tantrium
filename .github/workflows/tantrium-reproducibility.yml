name: Tantrium Reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lightweight-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run lightweight RH closure
        run: |
          export PYTHONPATH="$PWD"
          python tools/tantrium_rh_machine.py --strict
      - name: Generate manifest
        run: python tools/tantrium_artifact_manifest.py --command-used "github-actions lightweight-reproducibility"
      - name: Run independent verifier
        run: python tools/independent_verifier.py
