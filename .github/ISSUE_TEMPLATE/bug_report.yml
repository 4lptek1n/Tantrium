name: Bug report
description: Report a defect in Tantrium
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest code/steps that reproduce it.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tantrium version / commit
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version & OS
    validations:
      required: true
