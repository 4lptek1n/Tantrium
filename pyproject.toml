[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tantrium"
version = "0.3.0"
description = "Durumsuz, saf-matematik yapısal sertifikasyon makinesi — girdiyi spektral momentlere okur, Riemann Hipotezi ispat yapısından türetilmiş pozitiflik operatörleriyle sertifikalar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["riemann-hypothesis", "spectral-moments", "positivity", "certification", "cheminformatics"]
dependencies = [
  "sympy>=1.12",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Moleküler 3D üretim (design/arrange/morph → SDF). Yoksa moment-uzayı çalışır.
chem = ["rdkit>=2023.3"]
# REST API sunucusu (python -m tantrium.serve).
server = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
# Test + lint + tip-kontrolü.
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
tantrium-serve = "tantrium.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 satır-uzunluğu, E741 tek-harf, E731 lambda-atama (özet metotlarında bilinçli),
# E402 koşullu-import (FastAPI/opsiyonel bağımlılık guard'ı sonrası), E702 noktalı-virgül
ignore = ["E501", "E741", "E731", "E402", "E702"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # numpy/sympy/rdkit/fastapi stub'sız
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false      # kod tam-tipli değil — kademeli benimseme
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
module = ["rdkit.*"]            # rdkit-stubs kendi içinde bozuk → atla
follow_imports = "skip"
ignore_errors = true
