[project]
name = "tantrium"
version = "0.1.0"
description = "Structure-first symbolic discovery framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sympy>=1.12",
  "numpy>=1.24"
]

[project.optional-dependencies]
# Moleküler 3D üretim (design/arrange/morph → SDF). Yoksa moment-uzayı çalışır,
# 3D yapı üretimi devre dışı kalır.
chem = [
  "rdkit>=2023.3"
]
# REST API sunucusu (python -m tantrium.serve).
server = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0"
]
dev = [
  "pytest>=8.0"
]
# Görsel boyutu (enrichment image dimension → Wikimedia görseli → encode_image). Yoksa
# görsel oto-fetch fail-open atlanır; diğer boyutlar çalışır.
vision = [
  "pillow>=10.0"
]
# Gramatik parser (deep-research kapsamlı kavrama → spaCy dependency parsing: pasif/
# appositive/koordinasyon/gömülü TEK genel mekanizma). Yoksa regex-kalıplara fail-open düşer.
# Model: en_core_web_md (TEMİZ çıkarım — sm'in terse-cümle POS hatalarını düzeltir:
#   'Ribosomes'→NOUN/nsubj, 'light'→dobj, 'type 2 diabetes'→diabetes). md, sm ile aynı hız
#   sınıfı (CNN). _get_nlp md→sm→regex fail-open sırasıyla yükler.
#   elle kurulum: python -m spacy download en_core_web_md
nlp = [
  "spacy>=3.7",
  "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
