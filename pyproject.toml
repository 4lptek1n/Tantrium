[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tantrium"
version = "0.1.0"
description = "Structure-first symbolic discovery framework."
readme = "README.md"
requires-python = ">=3.10"
# NOTE: license is intentionally not yet declared (TBD). Until a LICENSE is added,
# this code is "all rights reserved" by default. Choose one before publishing.
authors = [{ name = "Tantrium maintainers" }]
keywords = ["symbolic", "moments", "spectral", "certification", "riemann-hypothesis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "sympy>=1.12",
  "numpy>=1.24"
]

[project.urls]
Homepage = "https://github.com/4lptek1n/tantrium"
Repository = "https://github.com/4lptek1n/tantrium"
Issues = "https://github.com/4lptek1n/tantrium/issues"
Changelog = "https://github.com/4lptek1n/tantrium/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Moleküler 3D üretim (design/arrange/morph → SDF). Yoksa moment-uzayı çalışır,
# 3D yapı üretimi devre dışı kalır.
chem = [
  "rdkit>=2023.3"
]
# REST API sunucusu (python -m tantrium.serve).
server = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0"
]
# Görsel boyutu (enrichment image dimension → Wikimedia görseli → encode_image). Yoksa
# görsel oto-fetch fail-open atlanır; diğer boyutlar çalışır.
vision = [
  "pillow>=10.0"
]
# Gramatik parser (deep-research kapsamlı kavrama → spaCy dependency parsing).
nlp = [
  "spacy>=3.7",
  "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"
]
# Geliştirme + kalite araç zinciri (lint/format/type/test/coverage/hooks).
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "build>=1.2",
]

[tool.hatch.metadata]
# nlp ekstra'sı doğrudan URL referansı içerir (spaCy modeli) — buna izin ver.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Yalnız kurulu paket src/tantrium tekerleğe girer. Üst-düzey tantrium/ (research_os)
# SADECE subprocess ile erişilir — tekerleğe DAHİL EDİLMEZ.
packages = ["src/tantrium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.coverage.run]
source = ["tantrium"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Paket + testlere odaklan; script/araç/araştırma-OS dizinleri kapsam dışı.
extend-exclude = ["web", "lib", "scripts", "artifacts", "docs", "tantrium", "tools"]

[tool.ruff.lint]
# Hafif ama anlamlı: pycodestyle/pyflakes/isort/pyupgrade/bugbear/comprehensions.
select = ["E", "F", "I", "UP", "B", "C4", "W"]
# Mevcut kod tabanına saygı: satır-uzunluğu (E501) ve bazı stilistik kurallar
# kademeli benimsenir; bunları başlangıçta yumuşatıyoruz (CI'yi kilitlememek için).
ignore = ["E501", "B008", "C401", "C408", "E741", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["tantrium"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Kademeli tipleme: çekirdek import edilebilirliğini doğrular, katı modu zorlamaz.
warn_unused_ignores = false
warn_redundant_casts = true
files = ["src/tantrium"]
