<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="38%">
      <stop offset="0%"   stop-color="#e8d090" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur-xs">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="600" height="600" fill="#000"/>

  <!-- Outer frame -->
  <rect x="14" y="14" width="572" height="572" fill="none" stroke="#c8a96e" stroke-width="0.6" opacity="0.5"/>
  <!-- Inner frame -->
  <rect x="22" y="22" width="556" height="556" fill="none" stroke="#c8a96e" stroke-width="0.3" opacity="0.25"/>

  <!-- Corner marks -->
  <line x1="14" y1="60"  x2="14" y2="14"  stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>
  <line x1="14" y1="14"  x2="60" y2="14"  stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>

  <line x1="586" y1="60"  x2="586" y2="14"  stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>
  <line x1="586" y1="14"  x2="540" y2="14"  stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>

  <line x1="14"  y1="540" x2="14"  y2="586" stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>
  <line x1="14"  y1="586" x2="60"  y2="586" stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>

  <line x1="586" y1="540" x2="586" y2="586" stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>
  <line x1="586" y1="586" x2="540" y2="586" stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>

  <!-- ── BACKGROUND GLOW ── -->
  <ellipse cx="300" cy="272" rx="160" ry="140" fill="url(#glow)"/>

  <!-- ── MOMENT MATRIX DOTS (Hankel pattern — upper triangular) ── -->
  <g opacity="0.07" fill="#c8a96e">
    <circle cx="220" cy="130" r="2.5"/>
    <circle cx="260" cy="130" r="2.5"/>
    <circle cx="300" cy="130" r="2.5"/>
    <circle cx="340" cy="130" r="2.5"/>
    <circle cx="380" cy="130" r="2.5"/>

    <circle cx="220" cy="160" r="2.5"/>
    <circle cx="260" cy="160" r="2.5"/>
    <circle cx="300" cy="160" r="2.5"/>
    <circle cx="340" cy="160" r="2.5"/>

    <circle cx="220" cy="190" r="2.5"/>
    <circle cx="260" cy="190" r="2.5"/>
    <circle cx="300" cy="190" r="2.5"/>

    <circle cx="220" cy="220" r="2.5"/>
    <circle cx="260" cy="220" r="2.5"/>

    <circle cx="220" cy="250" r="2.5"/>
  </g>

  <!-- ── ℵ ALEPH — deep ghost layer (enormous, centered) ── -->
  <text x="300" y="348"
        font-size="380"
        font-family="Georgia, 'Times New Roman', serif"
        text-anchor="middle"
        fill="#c8a96e"
        opacity="0.06"
        filter="url(#blur-sm)">ℵ</text>

  <!-- ── ℵ ALEPH — mid layer ── -->
  <text x="318" y="338"
        font-size="290"
        font-family="Georgia, 'Times New Roman', serif"
        text-anchor="middle"
        fill="#c8a96e"
        opacity="0.22">ℵ</text>

  <!-- ── ζ ZETA — glow halo ── -->
  <text x="272" y="318"
        font-size="280"
        font-family="Georgia, 'Times New Roman', serif"
        text-anchor="middle"
        fill="#e8d090"
        opacity="0.15"
        filter="url(#blur-xs)">ζ</text>

  <!-- ── ζ ZETA — main mark (foreground) ── -->
  <text x="268" y="320"
        font-size="268"
        font-family="Georgia, 'Times New Roman', serif"
        text-anchor="middle"
        fill="#c8a96e"
        opacity="0.96">ζ</text>

  <!-- ── ℵ ALEPH — foreground accent (overlapping) ── -->
  <text x="322" y="316"
        font-size="220"
        font-family="Georgia, 'Times New Roman', serif"
        text-anchor="middle"
        fill="#d4b87a"
        opacity="0.48">ℵ</text>

  <!-- ── DIVIDER LINE ── -->
  <line x1="80" y1="418" x2="520" y2="418" stroke="#c8a96e" stroke-width="0.5" opacity="0.3"/>

  <!-- ── WORDMARK: ZETALEPH ── -->
  <text x="300" y="464"
        font-size="34"
        font-family="'Courier New', Courier, monospace"
        letter-spacing="16"
        text-anchor="middle"
        fill="#c8a96e"
        opacity="1">ZETALEPH</text>

  <!-- ── SUBTITLE ── -->
  <text x="300" y="496"
        font-size="10"
        font-family="'Courier New', Courier, monospace"
        letter-spacing="5.5"
        text-anchor="middle"
        fill="#c8a96e"
        opacity="0.38">ARTIFICIAL  SUPERINTELLIGENCE</text>

  <!-- ── BOTTOM: ζ·ℵ mark (small) ── -->
  <text x="300" y="556"
        font-size="13"
        font-family="Georgia, serif"
        letter-spacing="3"
        text-anchor="middle"
        fill="#c8a96e"
        opacity="0.25">ζ · ℵ</text>
</svg>
