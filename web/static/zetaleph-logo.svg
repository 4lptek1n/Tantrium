<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="46%" r="52%">
      <stop offset="0%"   stop-color="#c8a96e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"  stop-opacity="1"/>
      <stop offset="35%"  stop-color="#e8d090"  stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c8a96e"  stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="500" height="500" fill="#000000"/>
  <circle cx="250" cy="226" r="210" fill="url(#ambient)"/>

  <!-- ── FRAME ── -->
  <rect x="14" y="14" width="472" height="472"
        fill="none" stroke="#c8a96e" stroke-width="0.55" opacity="0.45"/>

  <!-- Corner brackets (engineering drawing aesthetic) -->
  <path d="M14,56 L14,14 L56,14"   fill="none" stroke="#c8a96e" stroke-width="1.4" opacity="0.65"/>
  <path d="M486,56 L486,14 L444,14" fill="none" stroke="#c8a96e" stroke-width="1.4" opacity="0.65"/>
  <path d="M14,444 L14,486 L56,486"  fill="none" stroke="#c8a96e" stroke-width="1.4" opacity="0.65"/>
  <path d="M486,444 L486,486 L444,486" fill="none" stroke="#c8a96e" stroke-width="1.4" opacity="0.65"/>

  <!-- ── HANKEL ANTI-DIAGONAL TEXTURE ── -->
  <!-- Hankel matrix: each anti-diagonal (↗) has the same value.
       Visually: a family of parallel lines going top-right → bottom-left,
       evenly spaced — the geometric signature of Toeplitz/Hankel structure. -->
  <g stroke="#c8a96e" stroke-width="0.32" opacity="0.09">
    <line x1="40"  y1="130" x2="370" y2="460"/>
    <line x1="40"  y1="60"  x2="440" y2="460"/>
    <line x1="100" y1="40"  x2="460" y2="400"/>
    <line x1="180" y1="40"  x2="460" y2="320"/>
    <line x1="260" y1="40"  x2="460" y2="240"/>
    <line x1="340" y1="40"  x2="460" y2="160"/>
    <line x1="410" y1="40"  x2="460" y2="90"/>
    <line x1="40"  y1="200" x2="300" y2="460"/>
    <line x1="40"  y1="280" x2="220" y2="460"/>
    <line x1="40"  y1="360" x2="140" y2="460"/>
  </g>

  <!-- ── DYADIC RINGS ── -->
  <!-- Dyadic = binary subdivision: r₁=36, r₂=72, r₃=144
       Opacity also halves: 0.54 → 0.30 → 0.14
       This encodes the 1, 1/2, 1/4 mass distribution of dyadic transport. -->
  <circle cx="250" cy="226" r="144" fill="none" stroke="#c8a96e" stroke-width="0.45" opacity="0.14"/>
  <circle cx="250" cy="226" r="72"  fill="none" stroke="#c8a96e" stroke-width="0.70" opacity="0.30"/>
  <circle cx="250" cy="226" r="36"  fill="none" stroke="#c8a96e" stroke-width="1.00" opacity="0.54"/>

  <!-- ── STURM-LIOUVILLE HARMONIC WAVE ARMS ── -->
  <!-- The eigenfunctions of Sturm-Liouville operators are sinusoidal.
       Each arm is an S-curve (one full oscillation) radiating from the core.
       6-fold symmetry (related to hexagonal lattice / carbon ring geometry). -->

  <!-- Primary arms — 6 at every 60°, full weight -->
  <g fill="none" stroke="#c8a96e" stroke-width="1.15" opacity="0.68" filter="url(#glow-sm)">
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226" transform="rotate(0   250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226" transform="rotate(60  250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226" transform="rotate(120 250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226" transform="rotate(180 250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226" transform="rotate(240 250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226" transform="rotate(300 250 226)"/>
  </g>

  <!-- Secondary arms — 6 at 30° offset, longer, thinner, faded (second harmonic) -->
  <g fill="none" stroke="#c8a96e" stroke-width="0.65" opacity="0.30">
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226 C358,214 371,238 388,226" transform="rotate(30  250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226 C358,214 371,238 388,226" transform="rotate(90  250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226 C358,214 371,238 388,226" transform="rotate(150 250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226 C358,214 371,238 388,226" transform="rotate(210 250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226 C358,214 371,238 388,226" transform="rotate(270 250 226)"/>
    <path d="M250,226 C264,214 277,238 294,226 C311,214 324,238 341,226 C358,214 371,238 388,226" transform="rotate(330 250 226)"/>
  </g>

  <!-- ── CENTRAL NUCLEUS (core / kernel) ── -->
  <!-- The invariant fixed point: TAV paradigm F(x)=x.
       The Aleph gate: the first and most fundamental check.
       Everything in the system collapses to this center. -->
  <circle cx="250" cy="226" r="18" fill="#c8a96e" opacity="0.08"/>
  <circle cx="250" cy="226" r="11" fill="#c8a96e" opacity="0.20"/>
  <circle cx="250" cy="226" r="6"  fill="#d4b87a" opacity="0.75" filter="url(#glow-sm)"/>
  <circle cx="250" cy="226" r="2.8" fill="#ffffff" opacity="0.97"/>

  <!-- ── ζℵ GHOST LETTERMARK ── -->
  <text x="250" y="234"
        font-family="Georgia,'Times New Roman',serif"
        font-size="20" letter-spacing="3"
        text-anchor="middle"
        fill="#c8a96e" opacity="0.14">ζℵ</text>

  <!-- ── WORDMARK DIVIDER ── -->
  <line x1="70" y1="398" x2="430" y2="398"
        stroke="#c8a96e" stroke-width="0.45" opacity="0.28"/>

  <!-- ── WORDMARK: ZETALEPH ── -->
  <text x="250" y="436"
        font-family="'Courier New',Courier,monospace"
        font-size="29" letter-spacing="14"
        text-anchor="middle"
        fill="#c8a96e" opacity="1">ZETALEPH</text>

  <!-- ── SUBTITLE ── -->
  <text x="250" y="462"
        font-family="'Courier New',Courier,monospace"
        font-size="8.5" letter-spacing="5"
        text-anchor="middle"
        fill="#c8a96e" opacity="0.32">ARTIFICIAL  SUPERINTELLIGENCE</text>
</svg>
