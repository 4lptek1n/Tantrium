kind = "web"
previewPath = "/"
title = "Tantrium Boundary Engine"
version = "1.0.0"
id = "artifacts/tantrium"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23760

[services.development]
run = "pnpm --filter @workspace/tantrium run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tantrium", "run", "build" ]
publicDir = "artifacts/tantrium/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23760"
BASE_PATH = "/"
